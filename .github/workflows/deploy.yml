name: Deploy

on:
  push:
    branches: [claude/loving-thompson-7yjuky]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  INSTANCE_ID: i-0cbdb215d5b8ab095
  BRANCH: claude/loving-thompson-7yjuky
  REPO_URL: https://github.com/TheToxicDog/factory-gam.git

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Simulation tests
        run: node tests/sim.test.js
      - name: Multiplayer server tests
        run: node tests/mp.test.js

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Show deploy target
        run: |
          aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[].Instances[].{State:State.Name,AZ:Placement.AvailabilityZone,Type:InstanceType,PublicIp:PublicIpAddress,Name:Tags[?Key==`Name`]|[0].Value}' --output json
          IP=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          echo "PUBLIC_IP=$IP" >> "$GITHUB_ENV"

      # Replaces the app on the instance with this branch and restarts the game server
      # (deploy/remote.sh). Hosted worlds are kept.
      - name: Deploy via SSM
        run: |
          set -e
          SCRIPT=$(base64 -w0 deploy/remote.sh)
          jq -n --arg s "$SCRIPT" --arg b "$BRANCH" --arg r "$REPO_URL" \
            '{commands: ["echo \($s) | base64 -d > /tmp/cogworks-deploy.sh", "bash /tmp/cogworks-deploy.sh \($b) \($r)"]}' > params.json
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 600 \
            --parameters file://params.json \
            --query 'Command.CommandId' --output text)
          echo "Command ID: $COMMAND_ID"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' --output json
          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed with status: $STATUS"
            exit 1
          fi

      - name: Check it from outside
        run: |
          for i in $(seq 1 10); do curl -fsS "http://$PUBLIC_IP/healthz" && break; sleep 2; done
          curl -fsS "http://$PUBLIC_IP/api/lobbies"; echo
          echo "Play at http://$PUBLIC_IP/"

      - name: Diagnose instance (on failure)
        if: failure()
        run: |
          jq -n '{commands: ["exec 2>&1", "systemctl status tuff-game.service --no-pager | head -20", "journalctl -u tuff-game.service -n 60 --no-pager", "command -v node && node -v", "ls -la /opt/tuff-game /var/lib/cogworks | head -30"]}' > diag.json
          CID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --parameters file://diag.json --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$CID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text
