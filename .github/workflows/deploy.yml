name: Deploy

on:
  push:
    branches: [claude/ecstatic-goldberg-3lu9lm]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy via SSM
        run: |
          set -e
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0cbdb215d5b8ab095 \
            --document-name AWS-RunShellScript \
            --parameters 'commands=[
              "set -e",
              "cd /opt/tuff-game",
              "sudo -u tuff env HOME=/opt/tuff-game git fetch origin claude/ecstatic-goldberg-3lu9lm",
              "sudo -u tuff env HOME=/opt/tuff-game git reset --hard origin/claude/ecstatic-goldberg-3lu9lm",
              "sudo -u tuff env HOME=/opt/tuff-game npm ci",
              "sudo -u tuff env HOME=/opt/tuff-game npm run build",
              "systemctl restart tuff-game.service"
            ]' \
            --query 'Command.CommandId' --output text)

          echo "Command ID: $COMMAND_ID"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0cbdb215d5b8ab095 || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0cbdb215d5b8ab095 \
            --output text

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0cbdb215d5b8ab095 \
            --query 'Status' --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed with status: $STATUS"
            exit 1
          fi
